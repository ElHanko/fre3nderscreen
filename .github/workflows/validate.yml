name: validate

on:
  push:
  pull_request:

jobs:
  static-checks:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Python checks
        run: |
          for test in tests/test_*.py; do
            echo "==> $test"
            python3 "$test"
          done

      - name: Simulator shell syntax
        run: |
          bash -n dev/simulator/entrypoint.sh
          bash -n dev/simulator/screenshot.sh
          bash -n dev/simulator/simulator.sh
